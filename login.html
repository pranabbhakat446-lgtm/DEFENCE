
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defence India | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <div class="login-left">
        <h1>🛡 DEFENCE INDIA</h1>
        <h2>WELCOME BACK!</h2>
        <p>Strength, Courage and Commitment</p>
        <p>Secure your access to the Defence India Demo Portal.</p>
    </div>

    <div class="login-right">

        <div class="form-box">

            <h2 id="formTitle">Login</h2>
            <p class="subtitle">Access your account</p>

            <form id="loginForm">

                <input type="email"
                       id="loginEmail"
                       placeholder="Email Address"
                       required>

                <div class="password-box">
                    <input type="password"
                           id="loginPassword"
                           placeholder="Password"
                           required>
                    <span onclick="togglePassword('loginPassword')">
                        👁
                    </span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" onclick="forgotPassword(event)">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit">LOGIN</button>

                <p class="switch">
                    Don't have an account?
                    <a href="#" onclick="showRegister(event)">Register</a>
                </p>

            </form>

            <form id="registerForm" class="hidden">

                <input type="text"
                       id="regName"
                       placeholder="Full Name"
                       required>

                <input type="email"
                       id="regEmail"
                       placeholder="Email Address"
                       required>

                <input type="tel"
                       id="regPhone"
                       placeholder="Phone Number"
                       pattern="[0-9]{10}"
                       required>

                <input type="password"
                       id="regPassword"
                       placeholder="Create Password"
                       minlength="8"
                       required>

                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm Password"
                       minlength="8"
                       required>

                <button type="submit">CREATE ACCOUNT</button>

                <p class="switch">
                    Already have an account?
                    <a href="#" onclick="showLogin(event)">Login</a>
                </p>

            </form>

            <p id="message"></p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

<script src="login.js"></script>
</body>
</html>
